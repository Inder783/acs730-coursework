name: Python Dependencies
description: Set up Python and install Lab 4 dependencies

inputs:
  python-version:
    description: Python version to install
    required: true

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip
        cache-dependency-path: lab4/requirements-dev.txt

    - name: Install dependencies
      shell: bash
      run: python -m pip install -r lab4/requirements-dev.txt

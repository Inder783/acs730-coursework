name: Reusable Docker Build

on:
  workflow_call:
    inputs:
      publish:
        description: Whether to publish the image to GHCR
        required: false
        type: boolean
        default: false
    outputs:
      image-tag:
        description: Local Docker image tag
        value: ${{ jobs.build.outputs.image-tag }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.image.outputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image tag
        id: image
        run: |
          echo "tag=acs730-lab4:ci" >> "$GITHUB_OUTPUT"
          echo "ghcr_tag=ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: inputs.publish
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./lab4
          push: false
          load: true
          tags: |
            acs730-lab4:ci
            ${{ steps.image.outputs.ghcr_tag }}
          cache-from: type=gha,scope=lab4
          cache-to: type=gha,mode=max,scope=lab4

      - name: Push image to GHCR
        if: inputs.publish
        run: docker push "${{ steps.image.outputs.ghcr_tag }}"

      - name: Save Docker image
        run: docker save acs730-lab4:ci -o lab4-image.tar

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: lab4-docker-image
          path: lab4-image.tar
          retention-days: 1

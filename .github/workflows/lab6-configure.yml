name: lab6-configure

on:
  push:
    paths:
      - 'lab6/**'
      - '.github/workflows/lab6-configure.yml'
  workflow_dispatch:
    inputs:
      apply:
        description: "Actually create infrastructure (costs money)"
        type: boolean
        default: false

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  TF_IN_AUTOMATION: "true"

jobs:
  configure:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lab6/terraform
    steps:
      - uses: actions/checkout@v4

      - name: Install Ansible, AWS collections and boto3
        run: |
          python3 -m pip install --quiet "ansible-core==2.16.20" boto3 botocore
          ansible-galaxy collection install -r ../ansible/requirements.yml

      - name: Install the SSM Session Manager plugin
        run: |
          curl -sSfL -o /tmp/ssm.deb "https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb"
          sudo dpkg -i /tmp/ssm.deb
          session-manager-plugin --version

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.3
          terraform_wrapper: false

      - name: terraform init
        run: terraform init -input=false

      - name: terraform plan
        run: terraform plan -input=false

      - name: terraform apply
        if: inputs.apply
        run: terraform apply -input=false -auto-approve

      - name: Converge the instances with Ansible
        if: inputs.apply
        working-directory: lab6/ansible
        env:
          LAB6_SSM_BUCKET: ${{ format('acs730-lab6-ssm-{0}', secrets.AWS_ACCOUNT_ID) }}
        run: |
          test -n "$LAB6_SSM_BUCKET"
          online=0
          for i in $(seq 1 30); do
            if ansible -i inventory/ role_web -m ansible.builtin.ping; then
              online=1
              break
            fi
            echo "waiting for the SSM agent to register ($i/30)"
            sleep 10
          done
          test "$online" -eq 1 || { echo "SSM readiness timeout" >&2; exit 1; }
          ansible-playbook -i inventory/ site.yml -l role_web

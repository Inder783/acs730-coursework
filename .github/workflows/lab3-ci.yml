name: Lab 3 CI
on:
  push:
    branches: [main]
    paths: ['lab3/**', '.github/workflows/lab3-ci.yml']
  pull_request:
    paths: ['lab3/**', '.github/workflows/lab3-ci.yml']

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check script syntax
        run: |
          shopt -s nullglob
          for f in lab3/scripts/*.sh; do bash -n "$f"; done


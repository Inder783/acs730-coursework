name: Lab 4 Docker CI

on:
  push:
    branches: [main, lab4, lab4-pytest]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
	  cache: pip
          cache-dependency-path: lab4/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r lab4/requirements-dev.txt

      - name: Run tests
        working-directory: lab4
        run: python -m pytest -v

  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.image.outputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image tag
        id: image
        run: echo "tag=acs730-lab4:ci" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./lab4
          push: false
          load: true
          tags: acs730-lab4:ci
          cache-from: type=gha,scope=lab4
          cache-to: type=gha,mode=max,scope=lab4

      - name: Save Docker image
        run: docker save acs730-lab4:ci -o lab4-image.tar

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: lab4-docker-image
          path: lab4-image.tar
          retention-days: 1

  smoke:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: lab4-docker-image

      - name: Load Docker image
        run: docker load -i lab4-image.tar

      - name: Start container
        run: docker run -d --name lab4-ci -p 8000:8000 acs730-lab4:ci

      - name: Test health endpoint
        run: |
          for i in {1..15}; do
            if curl --fail --silent http://localhost:8000/healthz | grep -q '"status":"ok"'; then
              echo "Health check passed"
              exit 0
            fi
            sleep 2
          done
          docker logs lab4-ci
          exit 1

      - name: Stop container
        if: always()
        run: docker rm -f lab4-ci || true

  summary:
    needs: [test, build, smoke]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Report CI results
        env:
          TEST_RESULT: ${{ needs.test.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          SMOKE_RESULT: ${{ needs.smoke.result }}
          IMAGE_TAG: ${{ needs.build.outputs.image-tag }}
        run: |
          echo "## Lab 4 CI Results" >> "$GITHUB_STEP_SUMMARY"
          echo "- Test: $TEST_RESULT" >> "$GITHUB_STEP_SUMMARY"
          echo "- Build: $BUILD_RESULT" >> "$GITHUB_STEP_SUMMARY"
          echo "- Smoke: $SMOKE_RESULT" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: $IMAGE_TAG" >> "$GITHUB_STEP_SUMMARY"

          if [[ "$TEST_RESULT" != "success" ||
                "$BUILD_RESULT" != "success" ||
                "$SMOKE_RESULT" != "success" ]]; then
            echo "One or more CI jobs failed or were skipped."
            exit 1
          fi
